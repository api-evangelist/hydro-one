regulatory:
- id: ontario-reg-633-21
  name: O. Reg. 633/21 (Energy Data), Electricity Act, 1998, s. 25.35.8
  url: https://www.ontario.ca/laws/regulation/210633
  applies: true
  applies_evidence: >-
    Hydro One Networks Inc. is a licensed Ontario electricity local distribution
    company and therefore falls inside the class the regulation binds.
  obligation: >-
    Implement Green Button Download My Data and Connect My Data and have those
    implementations certified by the Green Button Alliance (deadline 01 November
    2023).
  regulator: https://www.oeb.ca/consumer-information-and-protection/green-button
certifications:
