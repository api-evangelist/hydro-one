name: Hydro One
kind: company
description: >-
  Hydro One Limited (TSX: H) is Canada's largest electricity transmission and
  distribution service provider, transmitting and distributing electricity
  across Ontario — the province the company describes as "home to 38 per cent of
  Canada's population." It sits in the regulated wires tier of the value chain:
  it owns and operates the provincial transmission grid and a rural/regional
  distribution network serving roughly 1.5 million customers, while the Ontario
  market itself is operated by the IESO and rates are set by the Ontario Energy
  Board. Its API posture is defined entirely by regulation, not by product.
  Ontario Regulation 633/21 (Energy Data, under the Electricity Act, 1998)
  compels Ontario electricity and natural gas distributors to implement Green
  Button Download My Data (DMD) and Connect My Data (CMD) and to have those
  implementations certified by the Green Button Alliance. Hydro One publishes
  DMD as an authenticated XML export inside My Account, runs a live Green Button
  CMD OAuth 2.0 authorization surface at www.hydroone.com/green-button-cmd-home,
  and operates a published third-party vendor onboarding form and terms and
  conditions — but the CMD resource base URI, client credentials, and test
  accounts are issued privately during onboarding and are not published
  anywhere. There is no developer subdomain, no OpenAPI or Swagger definition,
  and no self-serve signup. The split is the finding: consumer energy data is
  available through a real, standards-based, mandated API that a developer can
  only reach by application and 90-day connectivity testing, while open grid and
  market data is entirely absent — Hydro One publishes no open data portal and
  no documented public system or outage API, leaving Ontario market data to the
  IESO.
