findings:
  summary: >-
    Hydro One is the case that separates a mandate from an implementation and
    then, unusually, finds the implementation. Ontario compelled Green Button by
    regulation, and Hydro One has a working CMD OAuth surface and a real vendor
    onboarding pipeline behind it — but nothing about that surface is
    discoverable to a developer. There is no developer subdomain, no endpoint
    reference, no OpenAPI, no base URI, and no self-serve path. The entire API
    exists as a private bilateral integration granted one vendor at a time. On
    the other side of the ledger, a transmission and distribution utility that
    operates the provincial grid publishes zero open grid data; the only public
    data surface is a vendor-hosted outage map. Compliance produced an API;
    it did not produce a developer program.
  posture: mandated-and-implemented-but-undiscoverable
  gated: true
  openapiHarvested: false
